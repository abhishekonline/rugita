# Portock + Ledger only — no Todo, no Carousel.
#
# Use this instead of docker-compose.yml when `../todolist` and/or
# `../carousel` aren't checked out. It builds the Dockerfile's `minimal`
# target, which only touches the `portock` and `ledger` build contexts, and
# mounts a matching two-host tunnel config.
#
#   docker compose -f docker-compose.minimal.yml up --build
#
services:
  stack:
    build:
      context: ..
      dockerfile: rugita/Dockerfile
      target: minimal
      additional_contexts:
        portock: ../portock
        ledger: ../Ledger
    restart: unless-stopped
    volumes:
      # Persistent app data — lives on the host, survives container restarts
      - ~/.ssh:/root/.ssh:ro
      - ../portock/.git:/app/portock/.git
      - ../portock/backend/data:/app/portock/backend/data
      - ../Ledger/resources:/app/ledger/resources
      # Cloudflare tunnel credentials (read-only)
      - ~/.cloudflared:/etc/cloudflared:ro
      # Two-host tunnel config (portock + ledger only) — overrides any
      # existing file at that path
      - ./tunnel-config.minimal.yml:/app/tunnel-config.yml:ro
    environment:
      # Optional: base64-encoded service-account JSON for Ledger's Google Sheets.
      # Falls back to resources/service-account.json (covered by the volume above).
      - GOOGLE_SERVICE_ACCOUNT=${GOOGLE_SERVICE_ACCOUNT:-}
      # Portock Google Sheets config
      - PORTOCK_SHEET_ID=1pHEMQ2-0ob1-r1O7wLENhnJRxcJAOp47aKEvVofkVg8
      - GOOGLE_SERVICE_ACCOUNT_FILE=/app/ledger/resources/service-account.json
